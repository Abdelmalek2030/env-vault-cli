name: Continuous Cryptographic Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  fuzz:
    name: Hermetic AEAD & Envelope Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Randomized Cryptographic Fuzz Harness
        run: npm run fuzz
