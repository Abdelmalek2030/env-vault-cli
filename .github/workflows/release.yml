name: Release & Checksum Provenance

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Pre-Release Quality Gate
        run: |
          npm run lint
          npm test
          npm run fuzz

      - name: Build Tarball & SHA-256 Checksums
        run: |
          npm pack
          sha256sum env-vault-cli-*.tgz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            env-vault-cli-*.tgz
            checksums.txt
          generate_release_notes: true
